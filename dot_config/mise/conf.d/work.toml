# Work-machine-only tools; the profile gate is in .chezmoiignore. A separate file rather than a
# block inside config.toml because `miseg`/`miserm` run `chezmoi add` on config.toml, and chezmoi
# add on a template overwrites the source with rendered content. mise merges every conf.d/*.toml.
# Consequence: `miseg` on a work machine writes into the shared config.toml — move the line here.
#
# Group headings mirror config.toml, so an entry keeps its place in the shared ordering.
#
# Withheld from personal machines, but not private: this repository is public. A tool that can
# only be declared by naming an internal host therefore does not belong here either, and is
# declared in the work repository instead, reaching mise through its own conf.d/*.toml. Nothing
# about that arrangement is recorded here beyond this note.

[tools]

# === Git & forges ===
glab = "latest" # GitLab CLI — the corporate forge; personal work lives on GitHub

# === Cloud, secrets & networking ===
1password-cli = "latest" # work machines unlock secrets through 1Password, personal ones Bitwarden
