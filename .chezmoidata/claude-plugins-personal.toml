# Claude plugins for the PERSONAL profile (~/.claude-personal), consumed by
# private_dot_claude-personal/private_settings.json.tmpl.
#
# Unlike claudePlugins for the work profile, this set lives in the repository:
# both marketplaces are the owner's own and carry nothing an employer owns, so
# keeping it here is what makes a fresh personal machine arrive with its tools
# instead of silently having none. A machine that needs a different set still
# wins — data in ~/.config/chezmoi/chezmoi.toml overrides a .chezmoidata file.

[claudePluginsPersonal.marketplaces.armamentarium.source]
    source = "github"
    repo = "sanchpet/armamentarium"
[claudePluginsPersonal.marketplaces.armamentarium-privatum.source]
    source = "github"
    repo = "sanchpet/armamentarium-privatum"

[claudePluginsPersonal.enabled]
    "think@armamentarium" = true
    "verify@armamentarium" = true
    "techdoc@armamentarium" = true
    "humanize@armamentarium-privatum" = true
    "humanize-gate@armamentarium-privatum" = true
    "dotfiles@armamentarium-privatum" = true
