name: smoke

on:
  # Docs (*.md, LICENSE) don't affect the setup process, so skip the smoke run for
  # doc-only changes. A commit touching both docs and real files still runs (paths-ignore
  # skips only when every changed file matches). workflow_dispatch is the manual escape.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

jobs:
  # The repo is macOS-only by nature (Brewfile = Homebrew casks, installed only on
  # macOS). Linux is not tested: it is not among the target machines.
  bare-machine:
    runs-on: macos-latest
    # chezmoi init triggers .chezmoi.toml.tmpl → promptStringOnce. In a non-TTY (CI)
    # the interactive prompt fails with "could not open a new TTY", so the profile is
    # set explicitly via env (env-override in .chezmoi.toml.tmpl). personal is the light
    # path: it installs only the shared casks, without the heavy work-only dotnet-sdk.
    env:
      DOTFILES_PROFILE: personal
      # mise resolves tool versions via the GitHub API; unauthenticated CI hits the
      # 60 req/hour rate limit (403 → "No versions found"). The auto-provided token
      # raises it to 5000/hour. mise reads GITHUB_TOKEN.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone + bootstrap (as in the README quickstart)
        run: |
          git clone "https://github.com/${{ github.repository }}" "$HOME/dotfiles"
          bash "$HOME/dotfiles/bootstrap.sh"

      - name: Verify (core — mise / chezmoi / dotfiles / omz)
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          echo "mise:    $(mise --version)"
          echo "chezmoi: $(chezmoi --version)"
          test -f "$HOME/.gitconfig"               || { echo "❌ missing ~/.gitconfig"; exit 1; }
          test -f "$HOME/.config/mise/config.toml"  || { echo "❌ missing mise config"; exit 1; }
          test -d "$HOME/.oh-my-zsh"                || { echo "❌ missing Oh My Zsh"; exit 1; }
          # chezmoi's source is the bootstrap clone itself (chezmoi init --source), not a
          # second copy in ~/.local/share/chezmoi. Without a registered SSH key the origin→SSH
          # switch (bootstrap step 8) must not fire, so the clone stays on HTTPS in CI.
          src="$(chezmoi source-path)"
          git -C "$src" remote get-url origin | grep -q '^https://' \
            || { echo "❌ chezmoi source origin is not HTTPS in CI ($src)"; exit 1; }
          echo "✅ core bootstrap OK"

      - name: Verify .zshrc loads (omz + starship + zoxide + mise)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          test -f "$HOME/.zshrc" || { echo "❌ missing ~/.zshrc"; exit 1; }
          # A fresh interactive zsh must load without errors and bring up the components.
          # zoxide is configured with `--cmd cd`, so it provides `cd`/`cdi` (no `z`).
          out=$(zsh -i -c 'echo "starship=${STARSHIP_SHELL:-no}"; type cdi >/dev/null 2>&1 && echo "zoxide=yes" || echo "zoxide=no"' 2>&1)
          echo "$out"
          grep -q 'starship=zsh' <<<"$out" || { echo "❌ starship did not activate in .zshrc"; exit 1; }
          grep -q 'zoxide=yes'   <<<"$out" || { echo "❌ zoxide did not activate in .zshrc"; exit 1; }
          echo "✅ .zshrc loads OK (starship + zoxide active)"

      - name: Verify brew bundle (casks from Brewfile.tmpl)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          # Brewfile is a template; render it with the same profile bootstrap chose
          # (env DOTFILES_PROFILE=personal on the job) and check it.
          chezmoi execute-template < "$HOME/dotfiles/Brewfile.tmpl" > /tmp/Brewfile.rendered
          brew bundle check --file=/tmp/Brewfile.rendered \
            || { echo "❌ brew bundle: not all packages from the Brewfile are installed"; exit 1; }
          echo "✅ brew bundle OK (casks installed)"

  # Quick check of the per-machine template logic — without installing packages.
  # Covers the profile=work branch (dotnet-sdk) that the bootstrap job does not install,
  # to avoid pulling the heavy cask + sudo. Rendering is compared for both profiles.
  # Pure template rendering is OS-independent → ubuntu runner (faster/cheaper than macOS);
  # this is NOT a Linux-support check.
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Brewfile.tmpl renders correctly for both profiles
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          printf '[data]\n  profile = "work"\n'     > /tmp/work.toml
          printf '[data]\n  profile = "personal"\n' > /tmp/personal.toml
          work=$(chezmoi --config /tmp/work.toml execute-template < Brewfile.tmpl)
          personal=$(chezmoi --config /tmp/personal.toml execute-template < Brewfile.tmpl)

          if ! grep -q 'cask "freelens"' <<<"$work"; then
            echo "❌ work: missing shared cask freelens"; exit 1
          fi
          if ! grep -q 'cask "dotnet-sdk"' <<<"$work"; then
            echo "❌ work: missing work-only cask dotnet-sdk"; exit 1
          fi
          if grep -q 'cask "dotnet-sdk"' <<<"$personal"; then
            echo "❌ personal: dotnet-sdk leaked into the personal profile"; exit 1
          fi
          echo "✅ Brewfile.tmpl: work=freelens+dotnet-sdk, personal=freelens"

      - name: git identity — personal default, corporate identity data-driven & out of repo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Personal render (no work data): the base personal identity, and NO work
          # includeIf. The signing block is gated on the SSH key, which the runner does
          # not have, so it is correctly absent here.
          g=$(chezmoi execute-template < dot_gitconfig.tmpl)
          if ! grep -q 'email = petrov@sanch.pet' <<<"$g"; then
            echo "❌ gitconfig: missing personal email in the base config"; exit 1
          fi
          if grep -qE '^\[includeIf' <<<"$g"; then
            echo "❌ gitconfig: work includeIf must be absent without work data"; exit 1
          fi
          # Work render: inject dummy work data via a temp config (never a real value);
          # the includeIf appears with the given gitdir and work.inc renders the email.
          printf '[data]\n  profile = "work"\n[data.work]\n  name = "ci-work"\n  email = "ci-work@example.test"\n  gitdir = "~/work-repos/"\n' > /tmp/work.toml
          gw=$(chezmoi --config /tmp/work.toml execute-template < dot_gitconfig.tmpl)
          if ! grep -q 'gitdir:~/work-repos/' <<<"$gw"; then
            echo "❌ gitconfig: work includeIf missing when work.gitdir is set"; exit 1
          fi
          wi=$(chezmoi --config /tmp/work.toml execute-template < dot_config/git/work.inc.tmpl)
          if ! grep -q 'email = ci-work@example.test' <<<"$wi"; then
            echo "❌ work.inc: work email not rendered from data"; exit 1
          fi
          # No work signing key declared → signing is off under the work dir. The
          # personal key must never sign the employer's commits: that host cannot
          # verify it, so the signature only discloses the personal key.
          if ! grep -q 'gpgsign = false' <<<"$wi"; then
            echo "❌ work.inc: signing must be off when no work signing key is set"; exit 1
          fi
          # Anchored: the word also occurs in the file's comment block, so match the
          # config line itself and not any mention of it.
          if grep -qE '^[[:space:]]*signingkey' <<<"$wi"; then
            echo "❌ work.inc: no signingkey may be emitted without work.signingKey"; exit 1
          fi
          # With a work signing key → sign with THAT key, and signing stays on.
          printf '[data]\n  profile = "work"\n[data.work]\n  name = "ci-work"\n  email = "ci-work@example.test"\n  gitdir = "~/work-repos/"\n  signingKey = "ssh-ed25519 AAAACItIsNotARealKey"\n' > /tmp/work-signed.toml
          ws=$(chezmoi --config /tmp/work-signed.toml execute-template < dot_config/git/work.inc.tmpl)
          if ! grep -q 'signingkey = key::ssh-ed25519 AAAACItIsNotARealKey' <<<"$ws"; then
            echo "❌ work.inc: work.signingKey not rendered as the work signing key"; exit 1
          fi
          if grep -q 'gpgsign = false' <<<"$ws"; then
            echo "❌ work.inc: signing must stay on when a work signing key is set"; exit 1
          fi
          # The work key is trusted under the work email, so its commits verify locally.
          as=$(chezmoi --config /tmp/work-signed.toml execute-template < dot_config/git/allowed_signers.tmpl)
          if ! grep -q 'ci-work@example.test namespaces="git" ssh-ed25519 AAAACItIsNotARealKey' <<<"$as"; then
            echo "❌ allowed_signers: work key missing under the work principal"; exit 1
          fi
          # A machine with no work data must carry no work principal at all.
          asp=$(chezmoi execute-template < dot_config/git/allowed_signers.tmpl)
          if grep -q 'ci-work@example.test' <<<"$asp"; then
            echo "❌ allowed_signers: work principal leaked into a personal render"; exit 1
          fi
          echo "✅ git identity: personal base + data-driven work identity (out of repo)"

      - name: chezmoi re-init preserves a machine's existing data
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # chezmoi asks for `chezmoi init` every time .chezmoi.toml.tmpl changes. Run
          # without a TTY it takes neither the env nor the prompt branch, so each value
          # must fall back to what the machine already has — otherwise a routine re-init
          # wipes the corporate identity and both signing keys from a working machine.
          cfg=$(chezmoi --config /tmp/work-signed.toml execute-template --init < .chezmoi.toml.tmpl)
          for kv in 'name = "ci-work"' 'email = "ci-work@example.test"' \
                    'gitdir = "~/work-repos/"' 'signingKey = "ssh-ed25519 AAAACItIsNotARealKey"'; do
            if ! grep -qF "$kv" <<<"$cfg"; then
              echo "❌ re-init dropped an existing value: $kv"; exit 1
            fi
          done
          # A bare machine has nothing to keep and must still bootstrap unattended.
          : > /tmp/empty.toml
          bare=$(chezmoi --config /tmp/empty.toml execute-template --init < .chezmoi.toml.tmpl)
          if ! grep -qF 'profile = "personal"' <<<"$bare"; then
            echo "❌ bare machine: profile must default to personal"; exit 1
          fi
          if grep -qF 'ci-work' <<<"$bare"; then
            echo "❌ bare machine: work data must be blank"; exit 1
          fi
          echo "✅ chezmoi re-init: existing data preserved, bare machine still blank"

      - name: mise — no tool on a refused backend (ubi / vfox / asdf)
        run: |
          # `disable_backends` in the mise config stops this machine from installing a
          # ubi tool, but only this machine and only at install time. This guard is the
          # repo-level one: it fails the commit that introduces the declaration at all,
          # including from a machine whose mise predates the setting.
          # Anchored to a TOML key (start of line, optional quote) so that prose in the
          # README/CLAUDE.md explaining the rule does not match itself.
          if grep -rInE '^[[:space:]]*"?ubi:' --include='*.toml' --exclude-dir=.git .; then
            echo "❌ mise: ubi backend is deprecated (gone in 2027.1.0) — use github: instead"; exit 1
          fi
          # vfox/asdf run plugin code at install time and mise stopped accepting them.
          # The two grandfathered tools (redis, 1password-cli) resolve there via bare
          # registry names, so they do not trip this — only a NEW explicit declaration does.
          if grep -rInE '^[[:space:]]*"?(vfox|asdf):' --include='*.toml' --exclude-dir=.git .; then
            echo "❌ mise: vfox/asdf execute plugin code — use aqua: or github: (see README)"; exit 1
          fi
          if ! grep -qF 'disable_backends = ["ubi"]' dot_config/mise/config.toml; then
            echo "❌ mise: disable_backends must keep ubi banned in the mise config"; exit 1
          fi
          echo "✅ mise: no ubi backend, and the ban is declared"
