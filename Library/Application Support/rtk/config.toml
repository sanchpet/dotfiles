# rtk configuration.
#
# exclude_commands: never rewrite these — the filter drops content without saying so.
# Measured 2026-08-31 on a 104 KB Markdown file: `cat` returned 2178 of 26108 tokens,
# with no count, no footer and no tee log, so nothing in the output declared the loss
# and nothing offered it back. Across the whole history 203 of 1573 reads did this,
# the largest returning 44 tokens out of 387373.
#
# `grep`, `find` and `jq` truncate far harder — 25 of 100 matches, 52 of 300 paths,
# 42 of 300 lines — and they stay, because they do the opposite: each prints the true
# total, the number withheld, and the command that recovers the rest from a tee log.
# That is the test a filter has to pass here: not how little it removes, but whether
# its output refuses to look complete.
#
# A bare `git log` (no -n/--since) has the same defect — it stops at 50 of 469 commits
# in silence — but is not excluded: an explicit limit is honoured exactly, and the
# field compression is sound. Reported upstream instead.
exclude_commands = ["cat"]
